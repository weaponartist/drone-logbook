<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drone Logbook</title>
<meta name="theme-color" content="#0f1412">
<meta name="description" content="Bitácora de vuelo gratis para pilotos de drones: registra vuelos, normas DGAC (DAN 151), vencimientos de credencial y seguro. Tus datos quedan en tu teléfono.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_CL">
<meta property="og:title" content="Bitácora de Vuelo · Drones">
<meta property="og:description" content="Registra tus vuelos, revisa las normas DGAC y lleva tu bitácora en el teléfono. Gratis, en beta.">
<meta property="og:url" content="https://weaponartist.github.io/drone-logbook/">
<meta property="og:image" content="https://weaponartist.github.io/drone-logbook/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --surface:#ffffff; --surface-2:#eceee8; --text:#141815; --muted:#5f6760;
  --line:#dcdfd8; --accent:#4f7a00; --accent-ink:#ffffff; --lime:#c6f432; --warn:#b45309; --danger:#b42318;
  --laanc-bg:#eef9d0; --laanc-ink:#355200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1412; --surface:#171d1a; --surface-2:#202823; --text:#eef1ec; --muted:#98a29a;
    --line:#2a332d; --accent:#c6f432; --accent-ink:#121a00; --warn:#f5a524; --danger:#ff6b5e;
    --laanc-bg:#26340c; --laanc-ink:#d8f77a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171d1a; --surface-2:#202823; --text:#eef1ec; --muted:#98a29a;
  --line:#2a332d; --accent:#c6f432; --accent-ink:#121a00; --warn:#f5a524; --danger:#ff6b5e;
  --laanc-bg:#26340c; --laanc-ink:#d8f77a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-text-size-adjust:100%}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1}
header .pilot{color:var(--muted);font-size:13px}
main{max-width:760px;margin:0 auto;padding:16px 16px 110px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--text)}
nav.tabs button.on svg{color:var(--accent)}
.view{display:none}.view.on{display:block}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.note{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.45}
.note b{color:var(--text)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
h2.month{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.card:hover{border-color:var(--muted)}
.card.off{opacity:.55}
.date{width:44px;text-align:center;flex-shrink:0}
.date .d{font-size:20px;font-weight:700;line-height:1}
.date .w{font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:3px}
.card .body{flex:1;min-width:0}
.card .loc{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.badge.laanc{background:var(--laanc-bg);color:var(--laanc-ink)}
.badge.warn{color:var(--warn)}
.air{text-align:right;flex-shrink:0}
.air .v{font-weight:600}
.air .l{font-size:11px;color:var(--muted)}
.missing{color:var(--warn)}
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:31;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;display:flex;gap:6px;align-items:center}
#map{height:calc(100vh - 220px);min-height:360px;border-radius:12px;border:1px solid var(--line)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
#azResult,#faaResult{margin:10px 0 0;border-left:4px solid var(--line)}
#azResult.az-in,#faaResult.az-in{border-left-color:#c0392b;color:var(--text)}
#azResult.az-near,#faaResult.az-near{border-left-color:#d98c00;color:var(--text)}
#azResult.az-ok,#faaResult.az-ok{border-left-color:#4f7a00;color:var(--text)}
#faaLegend{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
#faaLegend .dot{margin-left:6px}
#azNote{margin:10px 0 0;font-size:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
section.box h3{margin:0 0 10px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .sub{font-size:12px;color:var(--muted)}
.btn{background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.small{padding:5px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--surface);color:var(--text);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:18px}
dialog h3{margin:0 0 14px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.sub{font-size:12px;color:var(--muted)}
.checks label{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:500;color:var(--text);margin:8px 0}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.dlg-actions .spacer{flex:1}
.empty{text-align:center;color:var(--muted);padding:40px 0}
ul.rules{margin:4px 0 10px;padding-left:18px;line-height:1.5}
ul.rules li{margin:6px 0}
.box a{color:var(--accent)}
.auth-approved{color:var(--accent)}.auth-sent{color:var(--warn)}.auth-rejected{color:var(--danger)}
.doc-ok{color:var(--accent)}.doc-soon{color:var(--warn)}.doc-bad{color:var(--danger);font-weight:600}
#print{display:none}
@media print{
  header,main,nav,.fab{display:none!important}
  @page{size:landscape;margin:10mm}
  #print{display:block;color:#000;font-family:Inter,sans-serif}
  #print table{width:100%;border-collapse:collapse;font-size:8.5px}
  #print th,#print td{border-bottom:1px solid #ccc;padding:4px;text-align:left}
}
</style>
</head>
<body>
<header>
  <h1 data-t="appName">Drone Logbook</h1>
  <span class="pilot" id="pilotName"></span>
</header>

<main>
  <div class="view on" id="v-log">
    <div class="stats" id="stats"></div>
    <div class="note" id="airNote"></div>
    <div class="toolbar" id="filters"></div>
    <div id="list"></div>
  </div>

  <div class="view" id="v-map">
    <div class="toolbar">
      <button class="chip" id="azToggle" data-t="azLayer">Airport zones</button>
      <button class="chip" id="faaToggle" data-t="faaLayer">LAANC grid</button>
      <button class="chip" id="azCheck" data-t="azCheck">Check my spot</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#7c8a80"></span><span data-t="recreational">Recreational</span></span>
      <span><span class="dot" style="background:#9bd400"></span><span data-t="proAuth">Professional / approval</span></span>
      <span class="azLeg" hidden><span class="dot" style="background:#c0392b"></span><span data-t="azL8">8 km airport zone</span></span>
      <span class="azLeg" hidden><span class="dot" style="background:#d98c00"></span><span data-t="azL5">5 km aerodrome zone</span></span>
      <span id="faaLegend" hidden></span>
    </div>
    <div id="map"></div>
    <div class="note" id="azResult" hidden></div>
    <div class="note" id="faaResult" hidden></div>
    <p class="note" id="azNote" data-t="azNote"></p>
  </div>

  <div class="view" id="v-fleet">
    <section class="box"><h3 data-t="drones">Drones</h3><div id="drones"></div>
      <div class="btns" style="margin-top:10px"><button class="btn small" id="addDrone" data-t="addDrone">+ Add drone</button></div></section>
    <section class="box"><h3 data-t="batteries">Batteries</h3><div id="batteries"></div>
      <div class="btns" style="margin-top:10px"><button class="btn small" id="addBattery" data-t="addBattery">+ Add battery</button></div></section>
  </div>

  <div class="view" id="v-rules"></div>

  <div class="view" id="v-more">
    <section class="box"><h3 data-t="settings">Settings</h3>
      <label data-t="pilot">Pilot in command</label><input id="setPilot">
      <label data-t="language">Language</label>
      <select id="setLang"><option value="en">English</option><option value="es">Español</option></select>
      <label data-t="country">Home country</label>
      <select id="setCountry"><option value="CL">🇨🇱 Chile</option><option value="US">🇺🇸 United States</option></select>
    </section>
    <section class="box"><h3 id="checkTitle">Pre-flight checklist</h3><div id="checkItems"></div>
      <div style="display:flex;gap:8px;margin-top:10px"><input id="newCheck" data-tp="newCheck"><button class="btn small" id="addCheck">+</button></div></section>
    <section class="box"><h3 data-t="data">Import &amp; export</h3>
      <div class="btns">
        <label class="btn" style="margin:0;color:var(--text);font-size:15px"><span data-t="importAP">Import AutoPylot CSV</span><input type="file" id="importFile" accept=".csv" hidden></label>
        <label class="btn" style="margin:0;color:var(--text);font-size:15px"><span data-t="importDJI">Import DJI flight logs</span><input type="file" id="importDJI" accept=".txt" multiple hidden></label>
        <button class="btn" id="exportCsv" data-t="exportCsv">Export CSV</button>
        <button class="btn" id="printLog" data-t="printLog">Print / PDF</button>
        <button class="btn" id="backup" data-t="backup">Download backup</button>
        <label class="btn" style="margin:0;color:var(--text);font-size:15px"><span data-t="restore">Restore backup</span><input type="file" id="restoreFile" accept=".json,application/json" hidden></label>
      </div>
      <p class="note" style="margin:12px 0 0" id="importMsg" hidden></p>
    </section>
    <section class="box"><a class="btn" id="feedback" href="#" style="display:inline-block;text-decoration:none" data-t="feedback">Send feedback</a></section>
    <section class="box"><h3 data-t="danger">Danger zone</h3>
      <button class="btn danger" id="resetAll" data-t="reset">Erase all data</button></section>
    <p class="sub" style="text-align:center;margin:20px 0 0">© 2026 weaponartist · All rights reserved</p>
  </div>
</main>

<button class="fab" id="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg><span data-t="logFlight">Log flight</span></button>

<nav class="tabs">
  <button class="on" data-view="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span data-t="tabLog">Log</span></button>
  <button data-view="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span data-t="tabMap">Map</span></button>
  <button data-view="fleet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="5" r="2.5"/><circle cx="19" cy="5" r="2.5"/><circle cx="5" cy="19" r="2.5"/><circle cx="19" cy="19" r="2.5"/><path d="M7 7l3 3M17 7l-3 3M7 17l3-3M17 17l-3-3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/></svg><span data-t="tabFleet">Fleet</span></button>
  <button data-view="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><span data-t="tabRules">Rules</span></button>
  <button data-view="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span data-t="tabMore">More</span></button>
</nav>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="print"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
<script src="auths.js"></script>
</body>
</html>
